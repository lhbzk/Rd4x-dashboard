<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">RD<span>4</span>X</div>
      <div class="brand-info">
        <div class="brand-title">RD4X Dashboard</div>
        <div class="brand-sub">V10 · Admin Panel</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item" data-route="overview" href="#/overview"><svg class="icon"><use href="#i-overview"/></svg><span>Visão Geral</span></a>
      <a class="nav-item" data-route="search" href="#/search"><svg class="icon"><use href="#i-search"/></svg><span>Busca Global</span></a>
      <a class="nav-item" data-route="users" href="#/users"><svg class="icon"><use href="#i-users"/></svg><span>Usuários</span></a>
      <a class="nav-item" data-route="tickets" href="#/tickets"><svg class="icon"><use href="#i-ticket"/></svg><span>Tickets</span></a>
      <a class="nav-item" data-route="releases" href="#/releases"><svg class="icon"><use href="#i-release"/></svg><span>Releases</span></a>
      <a class="nav-item" data-route="audit" href="#/audit"><svg class="icon"><use href="#i-audit"/></svg><span>Auditoria</span></a>
      <a class="nav-item" data-route="incidents" href="#/incidents"><svg class="icon"><use href="#i-incident"/></svg><span>Incidentes</span></a>
      <a class="nav-item" data-route="transcripts" href="#/transcripts"><svg class="icon"><use href="#i-transcript"/></svg><span>Transcripts</span></a>
      <a class="nav-item" data-route="settings" href="#/settings"><svg class="icon"><use href="#i-settings"/></svg><span>Configuração</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="api-status" id="sidebar-status">
        <span class="dot dot-warn"></span>
        <span class="status-text">Mock Mode</span>
      </div>
      <div class="demo-tag">DEMO / MOCK MODE</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Menu">
        <svg class="icon"><use href="#i-menu"/></svg>
      </button>
      <div class="search-wrap">
        <svg class="icon search-icon"><use href="#i-search"/></svg>
        <input type="text" id="global-search" class="search-input" placeholder="Busca global: ID, @user, ticket-1001, HWID, admin..." autocomplete="off">
        <kbd class="kbd">/</kbd>
      </div>
      <div class="topbar-right">
        <span class="demo-pill">DEMO</span>
        <button class="user-btn" id="user-btn" type="button">
          <div class="avatar avatar-sm">A</div>
          <div class="user-meta">
            <div class="user-name">Admin RD4X</div>
            <div class="user-role">Super Admin</div>
          </div>
        </button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

</html>
